{% extends "Base.peb.html" %}

{% block content %}
Found {{ books.size }} results.
<table class="search-result-table">
    <thead>
        <tr>
            <td>UID</td>
            <td>Cover</td>
            <td>Title</td>
            <td>Author</td>
            <td>QR</td>
        </tr>
    </thead>
    <tbody>
        {% for book in books %}
            <tr>
                <td>{{ book.id }}</td>
                <td style="text-align: center">{% if book.cover != 0 %}<a href="/book/{{ book.id }}"><img src="/api/cover/{{ book.cover }}" height="100" alt></a>{% endif %}</td>
                <td><a href="/book/{{ book.id }}">{{ book.title }}</a></td>
                <td>{{ book.author }}</td>
                <td>{% if book.barcode != "" %}<img src="/api/qr?code={{ book.barcode }}" alt>{% endif %}</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
